
name: Build Minecraft Mod

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      # 3. Install Gradle 8.11
      - name: Install Gradle 8.11
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11-bin.zip
          unzip -q gradle-8.11-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11/bin" >> "$GITHUB_PATH"

      # 4. Check Java and Gradle
      - name: Check Environment
        run: |
          java -version
          gradle --version

      # 5. Build Minecraft Fabric Mod
      - name: Build with Gradle
        run: |
          gradle --no-daemon clean build --stacktrace

      # 6. Upload JAR files
      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legit-aim-assist-build
          path: |
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # 7. Show build result
      - name: Build Summary
        if: always()
        run: |
          echo "Build completed with status: ${{ job.status }}"
