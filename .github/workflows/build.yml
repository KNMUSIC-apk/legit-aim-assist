
name: Build Minecraft Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install Gradle 8.10.2
        run: |
          wget https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Check Gradle
        run: gradle --version

      - name: Build with Gradle
        run: gradle build --no-daemon --stacktrace

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar-artifact
          path: build/libs/*.jar
          if-no-files-found: error
