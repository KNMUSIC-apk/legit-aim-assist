
name: Build Minecraft Mod

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 9.2.1
        shell: bash
        run: |
          set -euo pipefail

          VERSION=9.2.1

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-${VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Environment
        run: |
          java -version
          gradle --version

      - name: Validate Gradle Configuration
        run: |
          gradle --no-daemon tasks --stacktrace

      - name: Build Fabric Mod
        run: |
          gradle --no-daemon clean build --stacktrace

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/libs

          find build/libs -maxdepth 1 -type f -name '*.jar' -print

          if ! find build/libs -maxdepth 1 -type f -name '*.jar' | grep -q .; then
            echo "ERROR: No JAR generated"
            exit 1
          fi

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legit-aim-assist-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "Project: Legit Aim Assist"
          echo "Minecraft: 1.21.11"
          echo "Java: 21"
          echo "Gradle: 9.2.1"
          echo "Status: ${{ job.status }}"
