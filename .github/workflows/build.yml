
name: Build Minecraft Mod

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Install Gradle 9.2.1
      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_VERSION="9.2.1"
          DOWNLOAD="$RUNNER_TEMP/gradle.zip"

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$DOWNLOAD"

          unzip -q "$DOWNLOAD" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      # Verify environment
      - name: Verify Environment
        run: |
          java -version
          gradle --version

      # Build
      - name: Build Fabric Mod
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --no-configuration-cache \
            clean build \
            --stacktrace

      # Check output
      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking generated JAR files..."

          find build/libs -maxdepth 1 -type f -name '*.jar' -print

          if ! find build/libs -maxdepth 1 -type f -name '*.jar' | grep -q .; then
            echo "ERROR: No JAR generated!"
            exit 1
          fi

      # Upload
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legit-aim-assist-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      # Summary
      - name: Build Summary
        if: always()
        run: |
          echo "================================"
          echo "Project: Legit Aim Assist"
          echo "Minecraft: 1.21.11"
          echo "Java: 21"
          echo "Gradle: 9.2.1"
          echo "Status: ${{ job.status }}"
          echo "================================"
